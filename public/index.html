<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAIST I&TM 동문회 현황</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:#f4f4f2; color:#1a1a1a; padding:28px 24px;
}
.header { display:flex; align-items:center; gap:14px; margin-bottom:22px; }
.logo {
  width:44px; height:44px; background:#003478; border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:15px; font-weight:700; flex-shrink:0;
}
.header-text h1 { font-size:18px; font-weight:700; color:#111; }
.header-text p  { font-size:12px; color:#999; margin-top:2px; }

/* 로딩 */
.loading {
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; padding:60px; gap:16px;
}
.spinner {
  width:36px; height:36px; border:3px solid #e0e0e0;
  border-top-color:#003478; border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.loading p { font-size:14px; color:#888; }

/* 에러 */
.error-box {
  background:#fff0f0; border:1px solid #ffcccc; border-radius:12px;
  padding:20px 24px; color:#cc0000; font-size:14px; display:none;
}

/* 통계 카드 */
.stats {
  display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:18px;
}
.stat {
  background:#fff; border-radius:12px; padding:14px 16px;
  border:1px solid #e8e8e8;
}
.stat .lbl { font-size:11px; color:#999; margin-bottom:4px; }
.stat .val { font-size:26px; font-weight:700; color:#003478; }
.stat .sub { font-size:11px; color:#bbb; margin-top:1px; }

/* 탭 */
.tabs {
  display:flex; gap:4px; margin-bottom:16px;
  border-bottom:2px solid #e8e8e8;
}
.tab {
  padding:8px 18px; font-size:13px; font-weight:600;
  color:#999; cursor:pointer; border:none; background:none;
  border-bottom:2px solid transparent; margin-bottom:-2px;
}
.tab.active { color:#003478; border-bottom-color:#003478; }
.tab:hover  { color:#003478; }

.tab-content { display:none; }
.tab-content.active { display:block; }

.card {
  background:#fff; border-radius:12px; padding:20px 22px;
  border:1px solid #e8e8e8; margin-bottom:14px;
}
.card h2 {
  font-size:13px; font-weight:700; color:#333;
  margin-bottom:4px; display:flex; align-items:center; gap:7px;
}
.card h2 .dot {
  width:7px; height:7px; border-radius:50%;
  background:#003478; display:inline-block;
}
.card-sub { font-size:11px; color:#aaa; margin-bottom:14px; margin-left:14px; }

.two-col { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.updated-tag {
  font-size:11px; color:#bbb; text-align:right; margin-bottom:12px;
}
.footer { text-align:center; font-size:11px; color:#ccc; margin-top:10px; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">K</div>
  <div class="header-text">
    <h1>KAIST I&TM 동문회 현황</h1>
    <p>기술경영전문대학원 · Notion 실시간 연동</p>
  </div>
</div>

<!-- 에러 -->
<div class="error-box" id="error-box"></div>

<!-- 로딩 -->
<div class="loading" id="loading">
  <div class="spinner"></div>
  <p>노션 데이터 불러오는 중...</p>
</div>

<!-- 본문 (데이터 로드 후 표시) -->
<div id="main" style="display:none;">
  <div class="updated-tag" id="updated-tag"></div>

  <div class="stats">
    <div class="stat">
      <div class="lbl">전체 동문</div>
      <div class="val" id="s-total">-</div>
      <div class="sub">명</div>
    </div>
    <div class="stat">
      <div class="lbl">소속 기업/기관</div>
      <div class="val" id="s-company">-</div>
      <div class="sub">개</div>
    </div>
    <div class="stat">
      <div class="lbl">업종</div>
      <div class="val" id="s-industry">-</div>
      <div class="sub">개 분야</div>
    </div>
    <div class="stat">
      <div class="lbl">기수</div>
      <div class="val" id="s-class">-</div>
      <div class="sub">기</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('company', this)">소속회사별</button>
    <button class="tab" onclick="showTab('industry', this)">업종별</button>
    <button class="tab" onclick="showTab('class', this)">기수별</button>
    <button class="tab" onclick="showTab('degree', this)">학위별</button>
  </div>

  <!-- 소속회사 -->
  <div id="tab-company" class="tab-content active">
    <div class="card">
      <h2><span class="dot"></span>소속회사별 동문 인원</h2>
      <div class="card-sub" id="company-sub"></div>
      <div style="position:relative; height:520px;">
        <canvas id="companyChart"></canvas>
      </div>
    </div>
  </div>

  <!-- 업종 -->
  <div id="tab-industry" class="tab-content">
    <div class="card">
      <h2><span class="dot"></span>업종별 동문 분포</h2>
      <div class="card-sub" id="industry-sub"></div>
      <div style="position:relative; height:380px;">
        <canvas id="industryChart"></canvas>
      </div>
    </div>
  </div>

  <!-- 기수 -->
  <div id="tab-class" class="tab-content">
    <div class="card">
      <h2><span class="dot"></span>기수별 동문 현황</h2>
      <div class="card-sub" id="class-sub"></div>
      <div style="position:relative; height:260px;">
        <canvas id="classChart"></canvas>
      </div>
    </div>
  </div>

  <!-- 학위 -->
  <div id="tab-degree" class="tab-content">
    <div class="two-col">
      <div class="card">
        <h2><span class="dot"></span>최종학위 분포</h2>
        <div style="position:relative; height:260px;">
          <canvas id="degreeChart"></canvas>
        </div>
      </div>
      <div class="card">
        <h2><span class="dot"></span>업종 TOP 5</h2>
        <div style="position:relative; height:260px;">
          <canvas id="topChart"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="footer">KAIST 기술경영전문대학원 (I&TM) 동문회 · Powered by Notion API</div>

<script>
const BLUES = [
  '#003478','#0A3E88','#144892','#1E529C','#285CA6','#3266B0',
  '#3C70BA','#467AC4','#5084CE','#5A8ED8','#6498E2','#6EA2EC',
  '#78ACF6','#003478','#1E529C','#3C70BA','#5A8ED8','#78ACF6',
  '#003478','#0A3E88','#144892','#1E529C','#285CA6','#3266B0',
  '#3C70BA','#467AC4','#5084CE','#5A8ED8','#6498E2','#6EA2EC','#aac4e8'
];

const charts = {};
let globalStats = null;

// ── 탭 전환 ──
function showTab(name, btn) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');

  if (!charts[name] && globalStats) renderChart(name, globalStats);
}

// ── 데이터 fetch ──
async function loadData() {
  try {
    const res  = await fetch('/api/notion-data');
    const json = await res.json();

    if (!res.ok) throw new Error(json.error || '데이터 로드 실패');

    document.getElementById('loading').style.display = 'none';
    document.getElementById('main').style.display    = 'block';

    const { total, updated, stats } = json;
    globalStats = stats;

    // 통계 카드
    document.getElementById('s-total').textContent   = total.toLocaleString();
    document.getElementById('s-company').textContent = Object.keys(stats.company).length;
    document.getElementById('s-industry').textContent= Object.keys(stats.industry).length;
    document.getElementById('s-class').textContent   = Object.keys(stats.class).length;

    // 업데이트 시각
    const d = new Date(updated);
    document.getElementById('updated-tag').textContent =
      `최종 업데이트: ${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

    // 첫 탭(소속회사) 렌더링
    renderChart('company', stats);

  } catch (err) {
    document.getElementById('loading').style.display   = 'none';
    const box = document.getElementById('error-box');
    box.style.display = 'block';
    box.textContent   = '⚠️ 오류: ' + err.message;
  }
}

// ── 차트 렌더링 ──
function renderChart(name, stats) {
  if (name === 'company') {
    const all    = Object.entries(stats.company);
    const top30  = all.slice(0, 30);
    const others = all.slice(30).reduce((s, [,v]) => s+v, 0);
    const labels = top30.map(([k]) => k);
    const values = top30.map(([,v]) => v);
    if (others > 0) { labels.push('기타'); values.push(others); }

    document.getElementById('company-sub').textContent =
      `상위 30개 기업/기관 표시 (전체 ${all.length}개)`;

    charts.company = new Chart(document.getElementById('companyChart'), {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          data: values,
          backgroundColor: labels.map((l,i) => l === '기타' ? '#d0d0d0' : BLUES[i % BLUES.length]),
          borderRadius: 4, borderSkipped: false,
        }]
      },
      options: barOpts('y'),
    });
  }

  if (name === 'industry') {
    const entries = Object.entries(stats.industry);
    document.getElementById('industry-sub').textContent =
      `전체 ${entries.length}개 업종`;

    charts.industry = new Chart(document.getElementById('industryChart'), {
      type: 'bar',
      data: {
        labels: entries.map(([k]) => k),
        datasets: [{
          data: entries.map(([,v]) => v),
          backgroundColor: BLUES,
          borderRadius: 5, borderSkipped: false,
        }]
      },
      options: barOpts('y'),
    });
  }

  if (name === 'class') {
    const entries = Object.entries(stats.class);
    document.getElementById('class-sub').textContent =
      `1기~${entries[entries.length-1]?.[0] || ''}`;

    charts.class = new Chart(document.getElementById('classChart'), {
      type: 'bar',
      data: {
        labels: entries.map(([k]) => k),
        datasets: [{
          data: entries.map(([,v]) => v),
          backgroundColor: '#003478',
          borderRadius: 3, borderSkipped: false,
        }]
      },
      options: barOpts('x'),
    });
  }

  if (name === 'degree') {
    const degEntries = Object.entries(stats.degree);
    charts.degree = new Chart(document.getElementById('degreeChart'), {
      type: 'doughnut',
      data: {
        labels: degEntries.map(([k]) => k),
        datasets: [{
          data: degEntries.map(([,v]) => v),
          backgroundColor: ['#003478','#1E529C','#3C70BA','#5A8ED8','#8ab4e8','#c2d8f4'],
          borderWidth: 2, borderColor: '#fff', hoverOffset: 6,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '62%',
        plugins: {
          legend: { display:true, position:'bottom',
            labels: { font:{size:11}, color:'#555', padding:8, boxWidth:12 } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${ctx.raw}명` } }
        }
      }
    });

    const top5 = Object.entries(stats.industry).slice(0, 5);
    charts.top = new Chart(document.getElementById('topChart'), {
      type: 'pie',
      data: {
        labels: top5.map(([k]) => k),
        datasets: [{
          data: top5.map(([,v]) => v),
          backgroundColor: ['#003478','#1E529C','#3C70BA','#5A8ED8','#8ab4e8'],
          borderWidth: 2, borderColor: '#fff', hoverOffset: 6,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display:true, position:'bottom',
            labels: { font:{size:11}, color:'#555', padding:8, boxWidth:12 } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${ctx.raw}명` } }
        }
      }
    });
  }
}

// ── 공통 막대 옵션 ──
function barOpts(axis) {
  return {
    responsive: true, maintainAspectRatio: false,
    indexAxis: axis,
    plugins: {
      legend: { display: false },
      tooltip: { callbacks: { label: ctx => ` ${ctx.raw}명` } }
    },
    scales: {
      x: axis === 'y'
        ? { grid:{color:'#f0f0f0'}, ticks:{font:{size:11},color:'#888'} }
        : { grid:{display:false},   ticks:{font:{size:10},color:'#888'} },
      y: axis === 'y'
        ? { grid:{display:false},   ticks:{font:{size:11},color:'#444'} }
        : { grid:{color:'#f0f0f0'}, ticks:{font:{size:11},color:'#888'} },
    }
  };
}

// ── 실행 ──
loadData();
</script>
</body>
</html>
